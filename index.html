<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Peones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>Juego de Peones</h1>
        <p class="objetivo">Objetivo: intercambiar los peones blancos y negros</p>

        <div class="tablero" id="tablero">
            <!-- Las casillas se generan con JavaScript -->
        </div>

        <div class="controles">
            <button id="btnReiniciar">Reiniciar</button>
            <p id="mensaje"></p>
        </div>

        <div class="info">
            <p>Solo se juega en la diagonal a1 → h8</p>
            <p>Haz clic en un peón y luego en la casilla destino</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
